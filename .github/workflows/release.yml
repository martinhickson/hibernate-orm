name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 6.6.7-bravura-1)'
        required: true
        default: '6.6.7-bravura-1'
        type: string
      release_group:
        description: 'Maven groupId written into generated POMs for Central'
        required: true
        default: 'io.github.martinhickson'
        type: string
      base_branch:
        description: 'Base branch to create the release from'
        required: false
        default: 'maintenance'
        type: string
      branch_name:
        description: 'Release branch name'
        required: true
        default: 'release/6.6.7-bravura-1'
        type: string
      release_tag:
        description: 'Git tag for the release'
        required: true
        default: '6.6.7-bravura-1'
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
      publish_packages:
        description: 'Publish to GitHub Packages'
        required: false
        default: true
        type: boolean
      publish_central:
        description: 'Publish to Maven Central (needs Sonatype + GPG secrets)'
        required: false
        default: true
        type: boolean
      run_tests:
        description: 'Run tests before publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  RELEASE_VERSION: ${{ inputs.release_version }}
  RELEASE_GROUP: ${{ inputs.release_group }}
  BRANCH_NAME: ${{ inputs.branch_name }}
  TAG_NAME: ${{ inputs.release_tag }}
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          git fetch origin
          BASE_BRANCH="${{ inputs.base_branch }}"
          if git ls-remote --heads origin "${BASE_BRANCH}" | grep -q "${BASE_BRANCH}"; then
            git checkout "${BASE_BRANCH}"
            git pull origin "${BASE_BRANCH}"
          else
            echo "Base branch ${BASE_BRANCH} not found, using ${GITHUB_SHA}"
            git checkout "${GITHUB_SHA}"
          fi
          if git ls-remote --heads origin "${BRANCH_NAME}" | grep -q "${BRANCH_NAME}"; then
            git checkout "${BRANCH_NAME}"
            git pull origin "${BRANCH_NAME}"
          else
            git checkout -b "${BRANCH_NAME}"
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Rewrite version and groupId
        run: |
          chmod +x .github/scripts/rewrite-release-coordinates.sh
          .github/scripts/rewrite-release-coordinates.sh "${RELEASE_VERSION}" "${RELEASE_GROUP}"

      - name: Commit and push coordinate rewrite
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No coordinate changes to commit"
          else
            git commit -m "Release ${RELEASE_VERSION} as ${RELEASE_GROUP}"
          fi
          git push -u origin "${BRANCH_NAME}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-
            ${{ runner.os }}-gradle-

      - name: Build published artifacts
        run: |
          ./gradlew --no-daemon assemble \
            -PreleaseVersion="${RELEASE_VERSION}" \
            -PreleaseGroup="${RELEASE_GROUP}" \
            -x test

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: |
          ./gradlew --no-daemon test \
            -PreleaseVersion="${RELEASE_VERSION}" \
            -PreleaseGroup="${RELEASE_GROUP}"

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_packages }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
        run: |
          ./gradlew --no-daemon publishAllPublicationsToGitHubPackagesRepository \
            -PreleaseVersion="${RELEASE_VERSION}" \
            -PreleaseGroup="${RELEASE_GROUP}" \
            -x test

      - name: Publish to Maven Central
        if: ${{ inputs.publish_central }}
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          SIGNING_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: |
          if [ -z "${ORG_GRADLE_PROJECT_sonatypeUsername}" ] || [ -z "${ORG_GRADLE_PROJECT_sonatypePassword}" ]; then
            echo "MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD secrets are required for Maven Central"
            exit 1
          fi
          if [ -z "${SIGNING_GPG_PRIVATE_KEY}" ]; then
            echo "MAVEN_CENTRAL_GPG_PRIVATE_KEY is required for Maven Central"
            exit 1
          fi
          ./gradlew --no-daemon publishToSonatype closeAndReleaseSonatypeStagingRepositories \
            -PreleaseVersion="${RELEASE_VERSION}" \
            -PreleaseGroup="${RELEASE_GROUP}" \
            -x test

      - name: Create Git tag
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            echo "Tag ${TAG_NAME} already exists"
          else
            git tag -a "${TAG_NAME}" -m "Release ${RELEASE_VERSION}"
            git push origin "${TAG_NAME}"
          fi

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.RELEASE_VERSION }}
          body: |
            ## Release ${{ env.RELEASE_VERSION }}

            Published coordinates use groupId `${{ env.RELEASE_GROUP }}` so they can go to Maven Central.

            ```xml
            <dependency>
              <groupId>${{ env.RELEASE_GROUP }}</groupId>
              <artifactId>hibernate-core</artifactId>
              <version>${{ env.RELEASE_VERSION }}</version>
            </dependency>
            ```

            - Branch: `${{ env.BRANCH_NAME }}`
            - Tag: `${{ env.TAG_NAME }}`
            - GitHub Packages: `https://maven.pkg.github.com/${{ github.repository }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts-${{ inputs.release_version }}
          path: |
            **/build/libs/*.jar
            **/build/publications/**/*.pom
          retention-days: 30
          if-no-files-found: warn
